<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradeWorth</title>
  <meta name="description" content="Scan a trading card to estimate its centering grade and check current market value — pre-grading triage in your pocket.">
  <style>
    :root {
      --bg: #0c0f18;
      --bg-2: #161c30;
      --accent: #2ec4dc;
      --pink: #4f8bdc;
      --text: #f4f6fa;
      --muted: #9aa6bd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: radial-gradient(ellipse at center, var(--bg-2) 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 3.5em;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(46, 196, 220, 0.3);
      margin-bottom: 6px;
      text-align: center;
    }
    .sub {
      color: var(--pink);
      font-size: 1.2em;
      font-weight: 800;
      letter-spacing: 0.18em;
      margin-bottom: 40px;
      text-align: center;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.1em;
      max-width: 560px;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .link {
      display: inline-block;
      padding: 14px 28px;
      background: linear-gradient(180deg, var(--accent) 0%, #1f7fa6 100%);
      color: #000;
      text-decoration: none;
      font-weight: 800;
      border-radius: 999px;
      letter-spacing: 0.05em;
      transition: transform 0.15s ease;
    }
    .link:hover { transform: translateY(-2px); }
    .link.secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
    footer {
      margin-top: auto;
      color: var(--muted);
      font-size: 0.9em;
      padding-top: 40px;
    }
  </style>
</head>
<body>
  <h1>GradeWorth</h1>
  <div class="sub">CARD CENTERING &amp; VALUE</div>
  <p class="tagline">
    Scan a trading card to estimate its centering grade and check current market value —
    pre-grading triage that helps you decide what's worth sending off to grade.
  </p>
  <div class="links">
    <a class="link" href="https://apps.apple.com/app/gradeworth/" target="_blank">Download on App Store</a>
    <a class="link secondary" href="support.html">Support</a>
    <a class="link secondary" href="privacy.html">Privacy</a>
  </div>
  <footer>
    &copy; 2026 WD Card Shop LLC
  </footer>
</body>
</html>
